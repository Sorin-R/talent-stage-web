name: Deploy Web + Cloudflare Stream Env

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - vite.config.ts
      - .github/workflows/deploy-hostinger-cloudflare.yml

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_STREAM_UPLOADS: ${{ vars.VITE_STREAM_UPLOADS }}
        run: |
          set -euo pipefail
          export VITE_STREAM_UPLOADS="${VITE_STREAM_UPLOADS:-true}"
          npm run build

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy dist to Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          WEB_DEPLOY_PATH: ${{ secrets.WEB_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing secret SSH_HOST}"
          : "${SSH_PORT:?Missing secret SSH_PORT}"
          : "${SSH_USER:?Missing secret SSH_USER}"
          : "${WEB_DEPLOY_PATH:?Missing secret WEB_DEPLOY_PATH}"

          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "mkdir -p '$WEB_DEPLOY_PATH'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT -o StrictHostKeyChecking=no" \
            dist/ "$SSH_USER@$SSH_HOST:$WEB_DEPLOY_PATH/"

  update-backend-stream-env:
    runs-on: ubuntu-latest
    needs: deploy-web
    steps:
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Update backend env and restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          BACKEND_ENV_PATH: ${{ secrets.BACKEND_ENV_PATH }}
          BACKEND_APP_PATH: ${{ secrets.BACKEND_APP_PATH }}
          BACKEND_RESTART_CMD: ${{ secrets.BACKEND_RESTART_CMD }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_STREAM_TOKEN: ${{ secrets.CF_STREAM_TOKEN }}
          CF_STREAM_CUSTOMER_CODE: ${{ secrets.CF_STREAM_CUSTOMER_CODE }}
          CF_STREAM_MAX_DURATION_SEC: ${{ vars.CF_STREAM_MAX_DURATION_SEC }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing secret SSH_HOST}"
          : "${SSH_PORT:?Missing secret SSH_PORT}"
          : "${SSH_USER:?Missing secret SSH_USER}"
          : "${BACKEND_ENV_PATH:?Missing secret BACKEND_ENV_PATH}"
          : "${BACKEND_APP_PATH:?Missing secret BACKEND_APP_PATH}"
          : "${BACKEND_RESTART_CMD:?Missing secret BACKEND_RESTART_CMD}"
          : "${CF_ACCOUNT_ID:?Missing secret CF_ACCOUNT_ID}"
          : "${CF_STREAM_TOKEN:?Missing secret CF_STREAM_TOKEN}"

          CF_ACCOUNT_ID_B64="$(printf '%s' "$CF_ACCOUNT_ID" | base64 | tr -d '\n')"
          CF_STREAM_TOKEN_B64="$(printf '%s' "$CF_STREAM_TOKEN" | base64 | tr -d '\n')"
          CF_STREAM_CUSTOMER_CODE_B64="$(printf '%s' "${CF_STREAM_CUSTOMER_CODE:-}" | base64 | tr -d '\n')"
          CF_STREAM_MAX_DURATION_SEC="${CF_STREAM_MAX_DURATION_SEC:-900}"

          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "BACKEND_ENV_PATH='$BACKEND_ENV_PATH' BACKEND_APP_PATH='$BACKEND_APP_PATH' BACKEND_RESTART_CMD='$BACKEND_RESTART_CMD' CF_STREAM_MAX_DURATION_SEC='$CF_STREAM_MAX_DURATION_SEC' CF_ACCOUNT_ID_B64='$CF_ACCOUNT_ID_B64' CF_STREAM_TOKEN_B64='$CF_STREAM_TOKEN_B64' CF_STREAM_CUSTOMER_CODE_B64='$CF_STREAM_CUSTOMER_CODE_B64' bash -s" <<'EOF'
          set -euo pipefail

          decode_b64() {
            printf '%s' "$1" | base64 --decode
          }

          ENV_FILE="$BACKEND_ENV_PATH"
          APP_PATH="$BACKEND_APP_PATH"
          RESTART_CMD="$BACKEND_RESTART_CMD"

          CF_ACCOUNT_ID="$(decode_b64 "$CF_ACCOUNT_ID_B64")"
          CF_STREAM_TOKEN="$(decode_b64 "$CF_STREAM_TOKEN_B64")"
          CF_STREAM_CUSTOMER_CODE="$(decode_b64 "$CF_STREAM_CUSTOMER_CODE_B64")"

          mkdir -p "$(dirname "$ENV_FILE")"
          touch "$ENV_FILE"

          upsert_env() {
            key="$1"
            value="$2"
            if grep -qE "^${key}=" "$ENV_FILE"; then
              sed -i.bak "s|^${key}=.*|${key}=${value}|" "$ENV_FILE"
            else
              printf '\n%s=%s\n' "$key" "$value" >> "$ENV_FILE"
            fi
          }

          upsert_env "CF_ACCOUNT_ID" "$CF_ACCOUNT_ID"
          upsert_env "CF_STREAM_TOKEN" "$CF_STREAM_TOKEN"
          upsert_env "CF_STREAM_MAX_DURATION_SEC" "$CF_STREAM_MAX_DURATION_SEC"

          if [ -n "$CF_STREAM_CUSTOMER_CODE" ]; then
            upsert_env "CF_STREAM_CUSTOMER_CODE" "$CF_STREAM_CUSTOMER_CODE"
          fi

          cd "$APP_PATH"
          eval "$RESTART_CMD"
          EOF
