name: Deploy Web + Cloudflare Stream Env

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - vite.config.ts
      - .github/workflows/deploy-hostinger-cloudflare.yml

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_STREAM_UPLOADS: ${{ vars.VITE_STREAM_UPLOADS }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          set -euo pipefail
          export VITE_STREAM_UPLOADS="${VITE_STREAM_UPLOADS:-true}"
          export VITE_API_URL="${VITE_API_URL:-https://api.web-demo.space/api}"
          npm run build

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy dist to Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          WEB_DEPLOY_PATH: ${{ secrets.WEB_DEPLOY_PATH || vars.WEB_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          clean_one_line() {
            # Preserve internal spaces; remove CR/LF and surrounding whitespace.
            printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          }

          SSH_HOST="$(clean_one_line "${SSH_HOST:-}")"
          SSH_PORT="$(clean_one_line "${SSH_PORT:-}")"
          SSH_USER="$(clean_one_line "${SSH_USER:-}")"
          WEB_DEPLOY_PATH="$(clean_one_line "${WEB_DEPLOY_PATH:-}")"

          : "${SSH_HOST:?Missing SSH_HOST (secret or variable)}"
          : "${SSH_PORT:?Missing SSH_PORT (secret or variable)}"
          : "${SSH_USER:?Missing SSH_USER (secret or variable)}"
          : "${WEB_DEPLOY_PATH:?Missing WEB_DEPLOY_PATH (secret or variable)}"

          SSH_OPTS="-i ~/.ssh/id_ed25519 -p $SSH_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"

          for attempt in 1 2 3 4 5 6; do
            if ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$WEB_DEPLOY_PATH'"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "SSH mkdir failed after 6 attempts"
              exit 1
            fi
            echo "SSH mkdir attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done

          for attempt in 1 2 3 4 5 6; do
            if rsync -az --delete \
              -e "ssh $SSH_OPTS" \
              dist/ "$SSH_USER@$SSH_HOST:$WEB_DEPLOY_PATH/"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "rsync deploy failed after 6 attempts"
              exit 1
            fi
            echo "rsync attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done

  update-backend-stream-env:
    runs-on: ubuntu-latest
    needs: deploy-web
    steps:
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Update backend env and restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          BACKEND_ENV_PATH: ${{ secrets.BACKEND_ENV_PATH || vars.BACKEND_ENV_PATH }}
          BACKEND_APP_PATH: ${{ secrets.BACKEND_APP_PATH || vars.BACKEND_APP_PATH }}
          BACKEND_RESTART_CMD: ${{ secrets.BACKEND_RESTART_CMD || vars.BACKEND_RESTART_CMD }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_STREAM_TOKEN: ${{ secrets.CF_STREAM_TOKEN }}
          CF_STREAM_CUSTOMER_CODE: ${{ secrets.CF_STREAM_CUSTOMER_CODE }}
          CF_STREAM_MAX_DURATION_SEC: ${{ vars.CF_STREAM_MAX_DURATION_SEC }}
        run: |
          set -euo pipefail

          clean_single_line() {
            printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          }

          clean_multiline_to_spaces() {
            printf '%s' "$1" | tr '\r\n' ' ' | sed -e 's/[[:space:]]\+/ /g' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          }

          SSH_HOST="$(clean_single_line "${SSH_HOST:-}")"
          SSH_PORT="$(clean_single_line "${SSH_PORT:-}")"
          SSH_USER="$(clean_single_line "${SSH_USER:-}")"
          BACKEND_ENV_PATH="$(clean_single_line "${BACKEND_ENV_PATH:-}")"
          BACKEND_APP_PATH="$(clean_single_line "${BACKEND_APP_PATH:-}")"
          BACKEND_RESTART_CMD="$(clean_multiline_to_spaces "${BACKEND_RESTART_CMD:-}")"

          : "${SSH_HOST:?Missing SSH_HOST (secret or variable)}"
          : "${SSH_PORT:?Missing SSH_PORT (secret or variable)}"
          : "${SSH_USER:?Missing SSH_USER (secret or variable)}"
          : "${BACKEND_ENV_PATH:?Missing BACKEND_ENV_PATH (secret or variable)}"
          : "${BACKEND_APP_PATH:?Missing BACKEND_APP_PATH (secret or variable)}"
          : "${BACKEND_RESTART_CMD:?Missing BACKEND_RESTART_CMD (secret or variable)}"
          : "${CF_ACCOUNT_ID:?Missing secret CF_ACCOUNT_ID}"
          : "${CF_STREAM_TOKEN:?Missing secret CF_STREAM_TOKEN}"

          BACKEND_ENV_PATH_B64="$(printf '%s' "$BACKEND_ENV_PATH" | base64 | tr -d '\n')"
          BACKEND_APP_PATH_B64="$(printf '%s' "$BACKEND_APP_PATH" | base64 | tr -d '\n')"
          BACKEND_RESTART_CMD_B64="$(printf '%s' "$BACKEND_RESTART_CMD" | base64 | tr -d '\n')"
          CF_ACCOUNT_ID_B64="$(printf '%s' "$CF_ACCOUNT_ID" | base64 | tr -d '\n')"
          CF_STREAM_TOKEN_B64="$(printf '%s' "$CF_STREAM_TOKEN" | base64 | tr -d '\n')"
          CF_STREAM_CUSTOMER_CODE_B64="$(printf '%s' "${CF_STREAM_CUSTOMER_CODE:-}" | base64 | tr -d '\n')"
          CF_STREAM_MAX_DURATION_SEC="${CF_STREAM_MAX_DURATION_SEC:-900}"

          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" \
            "BACKEND_ENV_PATH_B64='$BACKEND_ENV_PATH_B64' BACKEND_APP_PATH_B64='$BACKEND_APP_PATH_B64' BACKEND_RESTART_CMD_B64='$BACKEND_RESTART_CMD_B64' CF_STREAM_MAX_DURATION_SEC='$CF_STREAM_MAX_DURATION_SEC' CF_ACCOUNT_ID_B64='$CF_ACCOUNT_ID_B64' CF_STREAM_TOKEN_B64='$CF_STREAM_TOKEN_B64' CF_STREAM_CUSTOMER_CODE_B64='$CF_STREAM_CUSTOMER_CODE_B64' bash -s" <<'EOF'
          set -euo pipefail

          decode_b64() {
            printf '%s' "$1" | base64 --decode
          }

          ENV_FILE="$(decode_b64 "$BACKEND_ENV_PATH_B64")"
          APP_PATH="$(decode_b64 "$BACKEND_APP_PATH_B64")"
          RESTART_CMD="$(decode_b64 "$BACKEND_RESTART_CMD_B64")"

          CF_ACCOUNT_ID="$(decode_b64 "$CF_ACCOUNT_ID_B64")"
          CF_STREAM_TOKEN="$(decode_b64 "$CF_STREAM_TOKEN_B64")"
          CF_STREAM_CUSTOMER_CODE="$(decode_b64 "$CF_STREAM_CUSTOMER_CODE_B64")"

          mkdir -p "$(dirname "$ENV_FILE")"
          touch "$ENV_FILE"

          upsert_env() {
            key="$1"
            value="$2"
            if grep -qE "^${key}=" "$ENV_FILE"; then
              sed -i.bak "s|^${key}=.*|${key}=${value}|" "$ENV_FILE"
            else
              printf '\n%s=%s\n' "$key" "$value" >> "$ENV_FILE"
            fi
          }

          upsert_env "CF_ACCOUNT_ID" "$CF_ACCOUNT_ID"
          upsert_env "CF_STREAM_TOKEN" "$CF_STREAM_TOKEN"
          upsert_env "CF_STREAM_MAX_DURATION_SEC" "$CF_STREAM_MAX_DURATION_SEC"

          if [ -n "$CF_STREAM_CUSTOMER_CODE" ]; then
            upsert_env "CF_STREAM_CUSTOMER_CODE" "$CF_STREAM_CUSTOMER_CODE"
          fi

          cd "$APP_PATH"
          eval "$RESTART_CMD"
          EOF
